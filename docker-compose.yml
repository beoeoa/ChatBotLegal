services:
  surrealdb:
    image: surrealdb/surrealdb:v2
    command: start --log info --user root --pass root rocksdb:/mydata/mydatabase.db
    user: root  # Required for bind mounts on Linux
    ports:
      - "8000:8000"
    volumes:
      - ./surreal_data:/mydata
    environment:
      - SURREAL_EXPERIMENTAL_GRAPHQL=true
    healthcheck:
      test: ["CMD", "/surreal", "is-ready", "--endpoint", "http://localhost:8000"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    restart: always
    pull_policy: always

  open_notebook:
    build:
      context: .
      dockerfile: Dockerfile
    image: hai-phong-legal-assistant:local
    ports:
      - "3000:8502"  # Web UI
      - "5055:5055"  # REST API
    environment:
      # REQUIRED: Change this to your own secret string
      # This encrypts your API keys in the database
      - OPEN_NOTEBOOK_ENCRYPTION_KEY=change-me-to-a-secret-string

      # Database connection (default values - no need to change)
      - SURREAL_URL=ws://surrealdb:8000/rpc
      - SURREAL_USER=root
      - SURREAL_PASSWORD=root
      - SURREAL_NAMESPACE=open_notebook
      - SURREAL_DATABASE=open_notebook
      - OPEN_NOTEBOOK_PASSWORD=${OPEN_NOTEBOOK_PASSWORD:-change-this-password}
      - LEGAL_SEARCH_URL=http://host.docker.internal:8765
      - LEGAL_LLM_TIMEOUT_SECONDS=90
      - LEGAL_STRUCTURED_GENERATION_TIMEOUT_SECONDS=${LEGAL_STRUCTURED_GENERATION_TIMEOUT_SECONDS:-60}
      - LEGAL_STRUCTURED_HARD_GENERATION_TIMEOUT_SECONDS=${LEGAL_STRUCTURED_HARD_GENERATION_TIMEOUT_SECONDS:-120}
      - LEGAL_STRUCTURED_TOTAL_TIMEOUT_SECONDS=${LEGAL_STRUCTURED_TOTAL_TIMEOUT_SECONDS:-90}
      - LEGAL_STRUCTURED_HARD_TOTAL_TIMEOUT_SECONDS=${LEGAL_STRUCTURED_HARD_TOTAL_TIMEOUT_SECONDS:-180}
      - LEGAL_STRUCTURED_MAX_OUTPUT_TOKENS=${LEGAL_STRUCTURED_MAX_OUTPUT_TOKENS:-2048}
      - FORM_RELEASE_ASSET_ROOT=/app/release-data
    volumes:
      - ./notebook_data:/app/data
      - ./data/uploads/forms:/app/data/uploads/forms:ro
      - ./release-data/feature017:/app/release-data/feature017:ro
    depends_on:
      surrealdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:5055/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: always

[project]
name = "open-notebook"
version = "1.9.0"
description = "An open source implementation of a research assistant, inspired by Google Notebook LM"
authors = [
    {name = "Luis Novo", email = "lfnovo@gmail.com"}
]
readme = "README.md"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.104.0",
    "firebase-admin>=6.9.0,<7",
    "uvicorn>=0.24.0",
    "pydantic>=2.9.2",
    "loguru>=0.7.2",
    "langchain>=1.2.0",
    "langgraph>=1.0.5",
    "tiktoken>=0.12.0",
    "langgraph-checkpoint-sqlite>=3.0.1",
    "langchain-community>=0.4.1",
    "langchain-openai>=1.1.14",
    "langchain-anthropic>=1.3.0",
    "langchain-ollama>=1.0.1",
    "langchain-google-genai>=4.1.2",
    "langchain-groq>=1.1.1",
    "langchain_mistralai>=1.1.1",
    "langchain_deepseek>=1.0.0",
    "tomli>=2.0.2",
    "python-dotenv>=1.2.2",
    "httpx[socks]>=0.27.0",
    "content-core>=1.14.1,<2",
    "ai-prompter>=0.4,<1",
    "esperanto>=2.20.0,<3",
    "surrealdb>=1.0.4",
    "surreal-commands>=1.3.1,<2",
    # PaddlePaddle 3.3 currently caps NumPy below 2.4. Keep one reproducible
    # version range for the main app and the optional layout-aware OCR extra.
    "numpy>=2.3.5,<2.4",
    "pycountry>=26.2.16",
    "babel>=2.18.0",
    "pypdf>=6.0,<7",
    "lxml-html-clean>=0.4.5",
    "openpyxl>=3.1.5,<4",
    "reportlab>=4.2,<5",
    "playwright>=1.62.0,<2",
    "crawl4ai==0.8.9",
]

[tool.setuptools]
package-dir = {"open_notebook" = "open_notebook"}

[tool.setuptools.package-data]
open_notebook = ["ai/assets/*"]


[project.optional-dependencies]
ocr = [
    "pillow>=12.3.0,<13.0",
    "pymupdf>=1.25.0",
    "pytesseract>=0.3.13",
]
paddle-ocr = [
    "paddleocr>=3.7.0,<4",
    # 3.3.x has an upstream Windows CPU PIR/oneDNN crash. 3.2.2 is the
    # documented stable workaround until Paddle fixes the regression.
    "paddlepaddle==3.2.2",
    "paddlex[ocr]>=3.7.2,<3.8",
]
retrieval = [
    "chromadb>=0.5,<1",
    "psycopg2-binary>=2.9,<3",
    # 2.13.0 currently fails to load shm.dll on the supported Windows runtime;
    # 2.9.x is also compatible with ModelScope used by PaddleOCR.
    "torch>=2.4,<2.10",
    "transformers>=4.45,<6",
]
dev = [
    "ipykernel>=6.29.5",
    "ruff>=0.5.5",
    "mypy>=1.11.1",
    "types-requests>=2.32.0.20241016",
    "ipywidgets>=8.1.5",
    "pre-commit>=4.0.1",
    "pytest>=9.0.3",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
# MoviePy 2.2.1 contains the Pillow API compatibility fixes used by the
# project, but its published dependency metadata still caps Pillow below 12.
# Docker/local release setup applies the reviewed exact metadata patch and
# runs video round-trip plus pip integrity checks.
override-dependencies = [
    "pillow>=12.3.0,<13.0",
    # Crawl4AI 0.8.9 still declares the historical lxml 5.x ceiling, while
    # lxml-html-clean 0.4.5 requires lxml 6.1.1+.  The APIs used by the shared
    # browser adapter are compatible with lxml 6.x and are covered by the
    # crawler smoke tests.
    "lxml>=6.1.1,<7",
]

[dependency-groups]
dev = [
    "pre-commit>=4.1.0",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.14.13",
    "types-requests>=2.32.4.20250913",
]

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = [
    "E501",  # line too long
    "E402",  # module level import not at top of file (Streamlit requires this pattern)
    "E722",  # do not use bare except (legacy code pattern)
    "F401",  # imported but unused (may be used in type hints or re-exports)
    "F541",  # f-string without placeholders
    "F841",  # local variable assigned but never used
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
    ".git",
    ".venv*",
    "external",
    "agent-skills-temp",
    "release-data",
    "node_modules",
]

[tool.ruff.lint.per-file-ignores]
# Streamlit files need nest_asyncio.apply() before imports
"app_home.py" = ["E402"]
"pages/**/*.py" = ["E402"]

[tool.mypy]
# Exclude Streamlit UI pages from type checking
[[tool.mypy.overrides]]
module = "pages.*"
ignore_errors = true
